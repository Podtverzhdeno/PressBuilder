name: M58 release evidence preflight

on:
  push:
    branches:
      - feat/m58-release-evidence-preflight-20261102
  pull_request:
    paths:
      - 'server/release-evidence-preflight.mjs'
      - 'tests/cloud-release-evidence-preflight.test.mjs'
      - 'tests/cloud-release-evidence-cli.test.mjs'
      - 'tools/release-preflight.mjs'
      - 'tools/inspect-p05-release.mjs'
      - 'server/release-media-integrity.mjs'
      - 'server/release-media-decode.mjs'
      - 'server/release-pcm-qc.mjs'
      - 'tests/cloud-release-pcm-qc.test.mjs'
      - 'server/release-loudness-qc.mjs'
      - 'server/release-performance-samples.mjs'
      - 'tools/measure-m58-performance.mjs'
      - 'tests/cloud-release-performance-samples.test.mjs'
      - 'tests/cloud-release-loudness-qc.test.mjs'
      - 'server/release-discovery.mjs'
      - 'tests/cloud-release-discovery.test.mjs'
      - 'package.json'
      - 'tests/cloud-release-six-scene-decode.test.mjs'
      - 'tools/inspect-p05-media.mjs'
      - 'tests/cloud-release-media-integrity.test.mjs'
      - 'docs/M58_RELEASE_PREFLIGHT.md'
      - '.github/workflows/m58-release-preflight.yml'

permissions:
  contents: read

jobs:
  preflight-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install and verify FFmpeg and FFprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Evidence, byte-integrity and six-scene media decode
        run: node --test tests/cloud-release-evidence-preflight.test.mjs tests/cloud-release-evidence-cli.test.mjs tests/cloud-release-media-integrity.test.mjs tests/cloud-release-six-scene-decode.test.mjs tests/cloud-release-discovery.test.mjs tests/cloud-release-pcm-qc.test.mjs tests/cloud-release-loudness-qc.test.mjs tests/cloud-release-performance-samples.test.mjs
      - run: npm run typecheck
      - run: npm run build
