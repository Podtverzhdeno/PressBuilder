name: PressBuilder Cloud CI
on:
  push:
    branches: [main, feat/cloud-mcp-video-editor-20261101, feat/p06-p07-frame-review-ui-20261101, agent/p04-p05-rebased-20261101, integration/p05-p10-release-contract-20261101]
  pull_request:
    paths:
      - 'server/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'package*.json'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install FFmpeg so montage tests cannot silently skip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm run test:cloud
      - name: Verify private MCP plugin package
        run: |
          node tools/mcp-plugin.mjs https://example.org
          tar -tzf out/pressbuilder-mcp-plugin.tar.gz

  render-smoke:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/agent/p04-p05-rebased-20261101' || github.ref == 'refs/heads/integration/p05-p10-release-contract-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build -t pressbuilder-cloud:ci .
      - name: Start isolated test service
        run: |
          docker run -d --name pb-cloud -p 3987:3000 \
            -e MCP_API_KEY=smoke-only-not-a-real-secret-0000000000000000 \
            -e PB_WEB_USER=smoke \
            -e PB_WEB_PASSWORD=smokePassword123456789 \
            pressbuilder-cloud:ci
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3987/health; then exit 0; fi
            sleep 2
          done
          docker logs pb-cloud
          exit 1
      - name: Render short video and download real MP4
        run: node tests/render-smoke.mjs
      - name: Diagnostics
        if: always()
        run: docker logs pb-cloud || true
