name: PressBuilder Cloud CI
on:
  push:
    branches: [main, feat/cloud-mcp-video-editor-20261101]
  pull_request:
    paths:
      - 'server/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'package*.json'
jobs:
  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:cloud
