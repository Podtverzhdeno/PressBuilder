name: PressBuilder Cloud CI
on:
  push:
    branches: [main, feat/cloud-mcp-video-editor-20261101, feat/p02-p03-production-hardening-20261101]
  pull_request:
    paths:
      - 'server/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'package*.json'
jobs:
  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:cloud
      - name: Verify private MCP plugin package
        run: |
          node tools/mcp-plugin.mjs https://example.org
          tar -tzf out/pressbuilder-mcp-plugin.tar.gz

  render-smoke:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/feat/p02-p03-production-hardening-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build -t pressbuilder-cloud:ci .
      - name: Capture review-only QC screenshots (desktop and mobile)
        run: |
          mkdir -p qc-visual-evidence
          docker run --rm --entrypoint node \
            -e PB_QC_EVIDENCE_DIR=/qc-evidence \
            -v "$PWD/qc-visual-evidence:/qc-evidence" \
            pressbuilder-cloud:ci \
            --test tests/cloud-qc-audio-browser.test.mjs
      - name: Require both review screenshots and readable fixture metadata
        run: |
          sudo chmod -R a+rX qc-visual-evidence
          test -s qc-visual-evidence/qc-audio-desktop-1280.png
          test -s qc-visual-evidence/qc-audio-desktop-findings-1280.png
          test -s qc-visual-evidence/qc-audio-mobile-390.png
          test -s qc-visual-evidence/qc-audio-visual-evidence.json
      - name: Start isolated test service
        run: |
          docker run -d --name pb-cloud -p 3987:3000 \
            -e MCP_API_KEY=smoke-only-not-a-real-secret-0000000000000000 \
            -e PB_WEB_USER=smoke \
            -e PB_WEB_PASSWORD=smokePassword123456789 \
            pressbuilder-cloud:ci
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3987/health; then exit 0; fi
            sleep 2
          done
          docker logs pb-cloud
          exit 1
      - name: Render short video and download real MP4
        run: node tests/render-smoke.mjs
      - name: Upload synthetic QC visual evidence (requires human review)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qc-audio-visual-evidence
          path: qc-visual-evidence/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
      - name: Diagnostics
        if: always()
        run: docker logs pb-cloud || true
